name: Cloudflare Skill Checks

on:
  push:
    paths:
      - "skills/cloudflare/**"
      - ".github/workflows/skill-checks.yml"
  pull_request:
    paths:
      - "skills/cloudflare/**"
      - ".github/workflows/skill-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python helpers
        run: python -m compileall -q skills/cloudflare/scripts skills/cloudflare/tests

      - name: Run offline regression tests
        run: python -m unittest discover -s skills/cloudflare/tests -v

      - name: Check skill entrypoint and references
        run: python skills/cloudflare/scripts/skill_lint.py --root skills/cloudflare

# Template only. Copy and adapt to a cf project that uses cloudflare.config.ts.
# Verify the installed cf CLI release, project build modes and deploy flags.
# An operator must configure GitHub's "production" environment, approval gates,
# account/zone-scoped secrets, protected branches, and IaC ownership beforehand.
name: Example Cloudflare cf Project

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx cf --version
      - run: npx cf build
      - run: npm run test --if-present

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx cf build
      - run: npx cf deploy --dry-run --no-provision
      # Require manual review and documented rollback before promotion.
      - run: npx cf deploy --no-provision
